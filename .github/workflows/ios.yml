# Compile l'app iOS sur un Mac de GitHub, la lance dans un simulateur iPhone
# et enregistre une capture de chaque écran (onglet « Actions » → dernière exécution → « Artifacts »).
name: App iOS — compilation et captures

on:
  push:
    paths: ['ios/**', 'data/**', '.github/workflows/ios.yml']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Trouver un simulateur iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, lst in devices.items() if 'iOS' in runtime for d in lst if d['name'].startswith('iPhone')]
          pick = next((d for d in phones if d['name'] == 'iPhone 16 Pro'), None) or next((d for d in phones if 'Pro' in d['name']), phones[0])
          print(pick['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Compiler
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Envol.xcodeproj -scheme Envol -configuration Debug \
            -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          # échec réel si la compilation a échoué (le dossier .app peut exister sans exécutable)
          ! grep -q "BUILD FAILED" build.log
          test -f build/Build/Products/Debug-iphonesimulator/Envol.app/Envol

      - name: Erreurs de compilation (si échec)
        if: failure()
        run: |
          # Chaque erreur Swift devient une annotation visible sur la page de l'exécution
          grep -E "^/.*\.swift:[0-9]+:[0-9]+: error:" ios/build.log | sort -u | head -50 | while IFS= read -r line; do
            file=$(echo "$line" | sed -E 's#^.*/(ios/Envol/[^:]+):([0-9]+):([0-9]+): error: (.*)$#\1#')
            ln=$(echo "$line" | sed -E 's#^.*\.swift:([0-9]+):([0-9]+): error: .*$#\1#')
            msg=$(echo "$line" | sed -E 's#^.*: error: (.*)$#\1#')
            echo "::error file=$file,line=$ln::$msg"
          done
          grep -E "error:" ios/build.log | sort -u | head -80 || true

      - name: Lancer l'app et capturer les écrans
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/Envol.app
          mkdir -p captures
          i=1
          for screen in onboarding0 onboarding2 onboarding3 onboarding4 onboarding5 onboarding7 home results detail explore favoris alertes profile; do
            xcrun simctl terminate "$UDID" fr.envol.app 2>/dev/null || true
            xcrun simctl launch "$UDID" fr.envol.app -demoScreen "$screen"
            sleep 9   # chargement de la base, des photos et fin des animations
            xcrun simctl io "$UDID" screenshot "captures/$(printf '%02d' $i)-$screen.png"
            i=$((i+1))
          done
          ls -la captures

      # Version pour un vrai iPhone, non signée : Sideloadly la signe avec ton identifiant Apple au moment de l'installation
      - name: Compiler pour iPhone (.ipa)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Envol.xcodeproj -scheme Envol -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          ! grep -q "BUILD FAILED" build-device.log
          APP=build-device/Build/Products/Release-iphoneos/Envol.app
          test -f "$APP/Envol"
          mkdir -p ../ipa/Payload
          cp -R "$APP" ../ipa/Payload/
          cd ../ipa && zip -qry Envol.ipa Payload && rm -rf Payload && ls -la

      - name: Enregistrer l'app iPhone
        uses: actions/upload-artifact@v4
        with:
          name: Envol-iPhone-ipa
          path: ipa/Envol.ipa

      - name: Enregistrer les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-iphone
          path: captures/
          if-no-files-found: ignore

      - name: Enregistrer le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: ios/build.log
          if-no-files-found: ignore
