# Projet Xcode décrit pour XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Générer le projet : brew install xcodegen && cd ios && xcodegen generate && open Envol.xcodeproj
name: Envol
options:
  bundleIdPrefix: fr.envol
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Envol:
    type: application
    platform: iOS
    sources:
      - path: Envol
      # La même base de données que le site : 10 000 vols + référentiel + photos
      - path: ../data/flights.csv
        buildPhase: resources
      - path: ../data/reference.json
        buildPhase: resources
      - path: ../data/photos.json
        buildPhase: resources
    info:
      path: Envol/Info.plist
      properties:
        CFBundleDisplayName: Envol
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Envol utilise votre position une seule fois pour proposer l'aéroport le plus proche comme ville de départ.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.envol.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Envol:
    build:
      targets:
        Envol: all
    run:
      config: Debug
